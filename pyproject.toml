[project]
name = "linkedin-apply"
version = "0.1.0"
description = "Semi-automated LinkedIn Easy Apply assistant with filters, an answer bank and an application tracker"
requires-python = ">=3.10"
dependencies = ["playwright>=1.40", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Offline resume reading: PDF text layer + OCR for scanned pages (models ship in the wheel)
ocr = ["pypdfium2>=4", "rapidocr-onnxruntime>=1.3; python_version < '3.13'"]

[project.scripts]
linkedin-apply = "linkedin_apply.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["linkedin_apply"]
